[package]
name = "slashbuilder-inference-kit"
version = "0.2.0"
edition = "2021"
description = "Local-first inference orchestration: model registry, routing, egress control and cost ledger, with optional Candle backends."
repository = "https://github.com/slash-builder/inference-kit"
documentation = "https://docs.rs/slashbuilder-inference-kit"
readme = "README.md"
license = "Apache-2.0"
keywords = ["inference", "llm", "local-first", "model-registry", "candle"]
categories = ["science", "command-line-utilities"]

# Allow-list of what may ever be packaged. With `include` set, anything not matched
# here stays out of the .crate, so a stray local file (a .cargo/ directory holding
# registry credentials, an .env, build output) can never ship by accident. Cargo
# ignores `exclude` when `include` is set, so there is deliberately no `exclude`.
# Review `cargo package --list` (and run `make package-check`) when adding to this list.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]

# The package is `slashbuilder-inference-kit`; the library is `inference_kit`
# (`use inference_kit::...`). The name is set explicitly so a rename of the package
# can never silently rename the library.
[lib]
name = "inference_kit"
path = "src/lib.rs"

[[bin]]
name = "inference-kit"
path = "src/bin/cli.rs"
# Always builds. `infer` requires the `candle` feature; without it, it exits
# with an actionable message instead of failing to compile. `hash`/`cache-stats`
# work unconditionally.

# docs.rs builds the CPU-only features. `cuda` is left out on purpose: it needs a CUDA
# toolkit at build time.
[package.metadata.docs.rs]
features = ["candle", "claude-proxy", "provider-anthropic", "provider-openai-compat", "provider-gemini", "conformance"]

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["rt", "macros", "io-util", "fs", "sync"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "2"

# Hashing (BLAKE3 for model integrity)
blake3 = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Storage Kit integration (models as artifacts)
# storage-kit = { path = "../storage-kit" }  # Uncomment when storage-kit is ready

# Service Kit integration (observability)
# service-kit = { path = "../service-kit" }  # Uncomment when service-kit is ready

# Score Kit integration (capability grants)
# score-kit = { path = "../score-kit" }  # Uncomment when score-kit is ready

# Message Kit integration (async fallback over Hearth)
# message-kit = { path = "../message-kit" }  # Uncomment when message-kit is available
# prost = "0.12"
# prost-types = "0.12"

# ML framework (Candle primary, TFLite secondary).
# Optional + feature-gated (see [features] below) so the default `cargo
# build`/`cargo test` (what Jenkinsfile runs, no flags) never touches these —
# only `--features candle` pulls them in. CPU-only by default on purpose: no
# cuda/metal/accelerate, so the default build is uniform across macOS and Linux.
# GPU is the separate opt-in `cuda` feature below (needs a CUDA toolkit at build time).
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.20", optional = true, default-features = false, features = ["onig"] }
# PNG encoder for the image backend (pure Rust).
png = { version = "0.17", optional = true }
# tflite = "0.1"  # Optional TensorFlow Lite, still deferred

# Remote proxy backend (Claude/Anthropic Messages API). Optional + feature-gated
# (see [features] below), same discipline as `candle`: off by default, so the
# default `cargo build`/`cargo test` never touches it. `default-features =
# false` + explicit `rustls-tls` avoids pulling in native-tls/OpenSSL, matching
# this crate's "uniform across macOS/Linux" build discipline.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }

# Utility
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
memmap2 = "0.9"  # For RO mmap of model weights

[features]
default = []
# Real local inference via Candle (POC). Off by default: keeps CI
# (Jenkinsfile: cargo test / fmt / clippy / build --release, no flags)
# untouched, since it pulls a real ML toolchain + requires `make fetch-model`
# to have downloaded weights for anything beyond `cargo build` to be useful.
candle = ["text", "image", "embedding"]

# The Candle backends are split by request kind so a build can leave kinds out (`candle` above is the umbrella, unchanged in
# meaning). `candle-base` is the shared machinery (device choice, VRAM check, BLAKE3 file verification) and the Candle deps.
candle-base = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
text = ["candle-base"]
embedding = ["candle-base"]
image = ["candle-base", "dep:png"]

# NVIDIA GPU inference through Candle's CUDA backend. Implies `candle`. Off by
# default and NOT part of CI (Jenkinsfile): it needs nvcc + the CUDA runtime
# libraries at build time and an NVIDIA driver at run time. The CPU backend is
# unchanged without it. See README "GPU (CUDA) — POC".
cuda = ["candle", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

# CLOUD FEATURES. Every feature below sends data to a third-party service when it is
# enabled AND configured. All are off by default (`default = []`), and a cloud call is
# still refused unless the caller supplies an explicit credential and the egress policy
# allows it. Enabling one means prompts and outputs leave your machine: read the
# "Cloud features and data egress" section of the README first.

# Remote proxy backend binding InferenceService to a third-party cloud API (the Claude
# Messages API first). EGRESS: sends prompts to that provider. Experimental. Even
# compiled in, it is inert without an explicit non-empty API key at construction time;
# see the module doc of `src/backends/claude_proxy.rs`.
claude-proxy = ["dep:reqwest"]

# The Claude Messages API as a ProviderAdapter (see src/providers/anthropic.rs).
# EGRESS: sends prompts and outputs to Anthropic. Tested against mocks only.
provider-anthropic = ["dep:reqwest"]

# An adapter for any OpenAI-compatible server (Ollama, llama.cpp server, a SaaS gateway):
# chat completions and embeddings. EGRESS: sends data to whichever server you point it at;
# a local server stays local, a hosted gateway does not.
provider-openai-compat = ["dep:reqwest"]

# Google Gemini (generateContent and embedContent) as a ProviderAdapter.
# EGRESS: sends prompts and outputs to Google. Tested against mocks only.
provider-gemini = ["dep:reqwest"]

# The provider conformance suite (src/conformance.rs) for adapters written outside this
# crate. No extra dependencies, no network.
conformance = []

[dev-dependencies]
# Test fixtures
tokio-test = "0.4"
tempfile = "3"
mockall = "0.12"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
